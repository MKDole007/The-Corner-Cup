<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Corner Cup | Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-shell">
        <section id="loginCard" class="admin-card admin-form">
            <h1>Admin Dashboard</h1>
            <p>Private staff area</p>
            <form id="loginForm">
                <input id="email" type="email" placeholder="Admin email" required>
                <input id="password" type="password" placeholder="Admin password" required>
                <button class="btn" type="submit">Log in</button>
            </form>
            <p id="loginError" class="error"></p>
        </section>

        <section id="ordersCard" class="admin-card" hidden>
            <div class="orders-header">
                <h1>Received Orders</h1>
                <div class="admin-actions">
                    <button id="refreshButton" class="btn" type="button">Refresh</button>
                    <button id="logoutButton" class="btn" type="button">Log out</button>
                </div>
            </div>
            <p id="ordersMessage"></p>
            <div id="orders"></div>
            <section class="menu-admin-section" aria-labelledby="menuAdminTitle">
                <div class="orders-header">
                    <div>
                        <h2 id="menuAdminTitle">Menu items</h2>
                        <p>Add a product and it will appear on the public menu.</p>
                    </div>
                    <button id="refreshMenuButton" class="btn" type="button">Refresh menu</button>
                </div>
                <form id="menuItemForm" class="menu-item-form">
                    <label>Item name<input name="name" required maxlength="100" placeholder="e.g. Caramel Latte"></label>
                    <label>Category
                        <select name="category" id="itemCategory" required>
                            <option value="Coffee">Coffee</option>
                            <option value="Tea">Tea</option>
                            <option value="Bakery">Bakery</option>
                            <option value="Sandwiches">Sandwiches</option>
                            <option value="Meals">Meals</option>
                            <option value="Cold Drinks">Cold Drinks</option>
                            <option value="Desserts">Desserts</option>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Snacks">Snacks</option>
                            <option value="Other">Create a category</option>
                        </select>
                    </label>
                    <label id="customCategoryField" hidden>New category<input name="customCategory" maxlength="40" placeholder="Enter a category name"></label>
                    <label>Price (₹)<input name="price" type="number" min="1" max="100000" step="1" required placeholder="199"></label>
                    <label>Description<input name="description" required maxlength="300" placeholder="Describe the item"></label>
                    <label>Ingredients<input name="ingredients" required maxlength="300" placeholder="Main ingredients"></label>
                    <label>Preparation time<input name="time" required maxlength="40" placeholder="10 min"></label>
                    <label class="image-upload-field">Product image (JPEG, PNG, WebP · max 1 MB)
                        <input id="itemImage" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
                    </label>
                    <img id="itemImagePreview" class="menu-image-preview" alt="Selected product preview" hidden>
                    <button class="btn" type="submit">Add item to menu</button>
                    <p id="menuItemMessage" class="form-message" aria-live="polite"></p>
                </form>
                <div id="adminMenuItems" class="admin-menu-items"></div>
            </section>
        </section>
    </main>
    <script>
        const loginCard = document.getElementById('loginCard');
        const ordersCard = document.getElementById('ordersCard');
        const loginError = document.getElementById('loginError');
        const ordersMessage = document.getElementById('ordersMessage');
        const ordersContainer = document.getElementById('orders');
        const menuItemForm = document.getElementById('menuItemForm');
        const menuItemMessage = document.getElementById('menuItemMessage');
        const adminMenuItems = document.getElementById('adminMenuItems');
        const itemImageInput = document.getElementById('itemImage');
        const itemImagePreview = document.getElementById('itemImagePreview');
        const categorySelect = document.getElementById('itemCategory');
        const customCategoryField = document.getElementById('customCategoryField');
        const apiBaseUrl = window.location.port === '3019' ? '' : 'http://localhost:3019';
        const paymentPromptedOrders = new Set(JSON.parse(sessionStorage.getItem('paymentPromptedOrders') || '[]'));
        let adminToken = sessionStorage.getItem('adminToken');
        let orderRefreshTimer;

        function formatStatus(status) {
            if (status === 'payment_successful') return 'Payment Successful';
            if (status === 'payment_not_received') return 'Payment Not Received';
            return status;
        }

        async function adminRequest(url, options = {}) {
            const headers = { ...(options.headers || {}), Authorization: `Bearer ${adminToken}` };
            const response = await fetch(`${apiBaseUrl}${url}`, { ...options, headers });
            if (response.status === 401) {
                sessionStorage.removeItem('adminToken');
                adminToken = null;
                showLogin();
                throw new Error('Admin session expired.');
            }
            return response;
        }

        function showLogin() {
            clearInterval(orderRefreshTimer);
            loginCard.hidden = false;
            ordersCard.hidden = true;
        }

        function startOrderRefresh() {
            clearInterval(orderRefreshTimer);
            orderRefreshTimer = setInterval(() => {
                loadOrders().catch(error => { ordersMessage.textContent = error.message; });
            }, 15000);
        }

        function createOrderCard(order) {
            const card = document.createElement('article');
            card.className = 'order-card';

            const orderId = document.createElement('strong');
            orderId.textContent = `Order ${order._id}`;
            card.appendChild(orderId);

            const customer = document.createElement('p');
            const customerName = document.createElement('strong');
            customerName.textContent = order.customerName;
            customer.append(customerName, ` — ${order.customerEmail}`);
            card.appendChild(customer);

            const items = document.createElement('p');
            items.textContent = (order.orderData.items || [])
                .map(item => `${item.quantity}x ${item.name}`)
                .join(', ');
            card.appendChild(items);

            const summary = document.createElement('p');
            const total = document.createElement('strong');
            total.textContent = `Total: Rs.${order.orderData.total}`;
            summary.append(total, ` · ${new Date(order.createdAt).toLocaleString()}`);
            card.appendChild(summary);

            const status = document.createElement('p');
            status.className = 'order-status';
            status.textContent = `Status: ${formatStatus(order.status)}`;
            card.appendChild(status);

            const label = document.createElement('label');
            label.textContent = 'Status: ';
            const select = document.createElement('select');
            select.dataset.orderId = order._id;
            select.addEventListener('change', () => updateStatus(select));
            ['new', 'payment_successful', 'payment_not_received', 'preparing', 'ready', 'completed', 'cancelled'].forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = formatStatus(status);
                option.selected = status === order.status;
                select.appendChild(option);
            });
            label.appendChild(select);
            card.appendChild(label);
            card.dataset.orderStatus = order.status;

            return card;
        }

        async function promptForPayment(order, card) {
            if (order.status !== 'new' || paymentPromptedOrders.has(order._id)) return;

            paymentPromptedOrders.add(order._id);
            sessionStorage.setItem('paymentPromptedOrders', JSON.stringify([...paymentPromptedOrders]));
            const select = card.querySelector('select');
            select.value = window.confirm(`Payment received for Order ${order._id}?`)
                ? 'payment_successful'
                : 'payment_not_received';
            await updateStatus(select);
        }

        async function loadOrders() {
            ordersMessage.textContent = 'Loading orders...';
            const response = await adminRequest('/api/admin/orders');
            if (!response.ok) throw new Error('Unable to load orders.');
            const orders = await response.json();
            ordersMessage.textContent = `${orders.length} order${orders.length === 1 ? '' : 's'} received`;
            ordersContainer.replaceChildren();
            if (!orders.length) {
                const emptyMessage = document.createElement('p');
                emptyMessage.textContent = 'No orders received yet.';
                ordersContainer.appendChild(emptyMessage);
                return;
            }
            for (const order of orders) {
                const card = createOrderCard(order);
                ordersContainer.appendChild(card);
                await promptForPayment(order, card);
            }
        }

        async function loadAdminMenu() {
            const response = await adminRequest('/api/menu-items');
            if (!response.ok) throw new Error('Unable to load menu items.');
            const items = await response.json();
            adminMenuItems.replaceChildren();
            if (!items.length) {
                adminMenuItems.textContent = 'No custom menu items yet.';
                return;
            }
            items.forEach(item => {
                const row = document.createElement('article');
                row.className = 'admin-menu-item';
                const image = document.createElement('img');
                image.src = item.image;
                image.alt = item.name;
                const details = document.createElement('div');
                const title = document.createElement('strong');
                title.textContent = item.name;
                const summary = document.createElement('p');
                summary.textContent = `${item.category} · ₹${item.price}`;
                details.append(title, summary);
                row.append(image, details);
                adminMenuItems.appendChild(row);
            });
        }

        function readImageAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Unable to read the selected image.'));
                reader.readAsDataURL(file);
            });
        }

        async function updateStatus(select) {
            const card = select.closest('.order-card');
            const status = card.querySelector('.order-status');
            const previousStatus = card.dataset.orderStatus;
            try {
                const response = await adminRequest(`/api/admin/orders/${select.dataset.orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: select.value })
                });
                if (!response.ok) throw new Error('Unable to update order status.');
                card.dataset.orderStatus = select.value;
                status.textContent = `Status: ${formatStatus(select.value)}`;
            } catch (error) {
                select.value = previousStatus;
                status.textContent = `Status: ${formatStatus(previousStatus)}`;
                alert(error.message);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            loginError.textContent = '';
            let response;
            let result;
            try {
                response = await fetch(`${apiBaseUrl}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                result = await response.json();
            } catch (error) {
                loginError.textContent = 'Cannot connect to the server.';
                return;
            }
            if (!response.ok) {
                loginError.textContent = result.message;
                return;
            }
            adminToken = result.token;
            sessionStorage.setItem('adminToken', adminToken);
            loginCard.hidden = true;
            ordersCard.hidden = false;
            await loadOrders();
            await loadAdminMenu().catch(error => { menuItemMessage.textContent = error.message; });
            startOrderRefresh();
        });

        document.getElementById('logoutButton').addEventListener('click', async () => {
            if (adminToken) await adminRequest('/api/admin/logout', { method: 'POST' });
            sessionStorage.removeItem('adminToken');
            adminToken = null;
            showLogin();
        });

        document.getElementById('refreshButton').addEventListener('click', () => {
            loadOrders().catch(error => { ordersMessage.textContent = error.message; });
        });

        document.getElementById('refreshMenuButton').addEventListener('click', () => {
            loadAdminMenu().catch(error => { menuItemMessage.textContent = error.message; });
        });

        categorySelect.addEventListener('change', () => {
            const isCustomCategory = categorySelect.value === 'Other';
            customCategoryField.hidden = !isCustomCategory;
            customCategoryField.querySelector('input').required = isCustomCategory;
        });

        itemImageInput.addEventListener('change', () => {
            const file = itemImageInput.files[0];
            itemImagePreview.hidden = !file;
            if (file) itemImagePreview.src = URL.createObjectURL(file);
        });

        menuItemForm.addEventListener('submit', async event => {
            event.preventDefault();
            menuItemMessage.textContent = '';
            const formData = new FormData(menuItemForm);
            const imageFile = itemImageInput.files[0];
            if (!imageFile || !['image/jpeg', 'image/png', 'image/webp'].includes(imageFile.type) || imageFile.size > 1024 * 1024) {
                menuItemMessage.textContent = 'Choose a JPEG, PNG, or WebP image under 1 MB.';
                return;
            }

            try {
                const category = categorySelect.value === 'Other'
                    ? String(formData.get('customCategory')).trim()
                    : categorySelect.value;
                const payload = {
                    name: formData.get('name'),
                    category,
                    price: Number(formData.get('price')),
                    description: formData.get('description'),
                    ingredients: formData.get('ingredients'),
                    time: formData.get('time'),
                    image: await readImageAsDataUrl(imageFile)
                };
                const response = await adminRequest('/api/admin/menu-items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Unable to add this item.');
                menuItemForm.reset();
                customCategoryField.hidden = true;
                customCategoryField.querySelector('input').required = false;
                itemImagePreview.hidden = true;
                itemImagePreview.removeAttribute('src');
                menuItemMessage.textContent = `${result.name} was added to the menu.`;
                await loadAdminMenu();
            } catch (error) {
                menuItemMessage.textContent = error.message || 'Unable to add this item.';
            }
        });

        if (adminToken) {
            loginCard.hidden = true;
            ordersCard.hidden = false;
            loadOrders()
                .then(() => Promise.all([loadAdminMenu(), startOrderRefresh()]))
                .catch(error => { ordersMessage.textContent = error.message; });
        }
    </script>
</body>
</html>
